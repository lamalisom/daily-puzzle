<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="puzzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="sudokuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" />

  <!-- Jigsaw Puzzle Piece Silhouette -->
  <g filter="url(#shadow)" transform="translate(48, 64)">
    <path d="M 60,60 
             L 130,60 
             C 130,30 170,30 170,60 
             L 240,60 
             L 240,130 
             C 270,130 270,170 240,170 
             L 240,240 
             L 170,240 
             C 170,270 130,270 130,240 
             L 60,240 
             L 60,170 
             C 30,170 30,130 60,130 
             Z" 
          fill="url(#puzzleGrad)" />
  </g>

  <!-- Mini Sudoku Accent Overlay -->
  <g transform="translate(230, 230)" filter="url(#shadow)">
    <!-- Sudoku mini 3x3 square -->
    <rect x="0" y="0" width="180" height="180" rx="28" fill="#0f172a" stroke="#818cf8" stroke-width="4" />
    <!-- Grid lines -->
    <line x1="60" y1="0" x2="60" y2="180" stroke="#475569" stroke-width="2" />
    <line x1="120" y1="0" x2="120" y2="180" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="60" x2="180" y2="60" stroke="#475569" stroke-width="2" />
    <line x1="0" y1="120" x2="180" y2="120" stroke="#475569" stroke-width="2" />

    <!-- Number Glyphs -->
    <text x="30" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="middle">5</text>
    <text x="90" y="102" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#sudokuGrad)" text-anchor="middle">9</text>
    <text x="150" y="162" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">3</text>
    <text x="150" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#e2e8f0" text-anchor="middle">7</text>
  </g>
</svg>
